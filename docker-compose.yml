services:
  tracker:
    build: .

    container_name: object-tracking

    restart: unless-stopped

    ports:
      - "8080:8080"

    volumes:

      - ./src/resources/weights:/app/src/resources/weights:ro

      - ./src/resources/configs:/app/src/resources/configs:ro

      - ./src/resources/logs:/app/src/resources/logs

    environment:

      - RTSP_URL=${RTSP_URL}
      - PREVIEW_WINDOW=false
      - WEB_HOST=0.0.0.0
      - WEB_PORT=8080
      - WEBRTC_ICE_SERVERS=${WEBRTC_ICE_SERVERS:-}
    
    env_file:
      - .env

    command: ["python", "-m", "src.main"]
